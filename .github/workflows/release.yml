name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            mainExe: SqlVersionControl
            icon: AppIcon.icns
            channel: osx
          - os: windows-latest
            rid: win-x64
            mainExe: SqlVersionControl.exe
            icon: Assets/AppIcon.ico
            channel: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained -f net9.0 -o publish/${{ matrix.rid }}

      - name: Pack with Velopack
        run: vpk pack --packId SqlVersionControl --packVersion ${{ steps.version.outputs.VERSION }} --packDir publish/${{ matrix.rid }} --mainExe ${{ matrix.mainExe }} --icon ${{ matrix.icon }} --outputDir Releases

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: releases-${{ matrix.channel }}
          path: Releases/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-releases
          merge-multiple: true

      - name: List release files
        run: ls -lh all-releases/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-releases/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
